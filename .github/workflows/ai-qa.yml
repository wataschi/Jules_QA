name: AI QA MVP

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'regression'
        type: choice
        options:
          - warm-up
          - regression
  schedule:
    # Weekly warm-up to refresh locator cache (Monday 03:00 UTC)
    - cron: '0 3 * * 1'

jobs:
  warm-up:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'warm-up')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run warm-up
        env:
          QA_MODE: warm-up
          QA_SCENARIO_PATH: scenarios/invalid-password.yaml
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          QA_TARGET_URL: https://example.com
        run: npm run qa -- --scenario scenarios/invalid-password.yaml --mode warm-up

      - name: Upload cache artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-cache-warm-up
          path: |
            midscene_run/cache/
            midscene_run/plans/
            .stagehand-cache/

  regression:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'regression'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Download cache from warm-up (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-cache-warm-up
          path: .

      - name: Run regression (read-only cache)
        env:
          QA_MODE: regression
          QA_SCENARIO_PATH: scenarios/invalid-password.yaml
          DEBUG: midscene:cache:*
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          QA_TARGET_URL: https://example.com
        run: npm run qa -- --scenario scenarios/invalid-password.yaml --mode regression

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            midscene_run/
            playwright-report/
            test-results/
