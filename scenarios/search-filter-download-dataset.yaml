name: search-filter-download-dataset
goal: Перевірити успішний пошук, фільтрацію та завантаження наборів даних з коректним відображенням метаданих на порталі Kyiv City.
target_url: https://data.kyivcity.gov.ua/
tags:
  - search
  - filter
  - download
  - metadata
group: Data Portal E2E
hints:
  - Використовуйте видимий текст кнопок та полів для ідентифікації елементів.
  - Переконайтеся, що сторінка повністю завантажилася перед початком взаємодії.
  - Фільтри можуть знаходитися у бічній панелі або над результатами пошуку.
steps:
  - navigate на URL https://data.kyivcity.gov.ua/
  - wait, поки головний інтерфейс порталу повністю завантажиться та стане інтерактивним
  - type у поле пошуку текст «транспорт»
  - click кнопку виконання пошуку (наприклад, іконка лупи або кнопка 'Пошук')
  - wait, поки результати пошуку відобразяться на екрані
  - select фільтр за категорією з доступних опцій фільтрації
  - click перший релевантний результат зі списку для переходу на сторінку деталей набору даних
  - wait, поки сторінка деталей завантажиться
checkpoints: []
success_criteria:
  - На сторінці результатів пошуку відображаються записи, що містять слово «транспорт»
  - Після вибору фільтра список результатів оновлюється відповідно до обраних критеріїв
  - "На сторінці деталей набору даних коректно відображаються метадані: назва, опис, формат, розмір та дата оновлення"
navigation:
  type: ai
  url: https://data.kyivcity.gov.ua/
