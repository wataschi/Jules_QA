name: dataset-search-filter-download
goal: Перевірити успішний пошук, фільтрацію та завантаження наборів даних у різних форматах з коректним відображенням метаданих.
target_url: https://data.kyivcity.gov.ua
tags:
  - search
  - filtering
  - download
  - metadata
  - e2e
group: KyivCity Data Portal
hints:
  - Не виконувати оплату або видалення даних.
  - Перевіряти лише публічні набори даних без обмеженого доступу.
steps:
  - Відкрити головну сторінку порталу та переконатися у повному завантаженні інтерфейсу.
  - Знайти поле пошуку, ввести запит «транспорт» та натиснути кнопку виконання пошуку.
  - Використати бічну панель фільтрів для обмеження результатів за категорією або форматом файлу.
  - Клікнути на перший релевантний результат зі списку для переходу на сторінку деталей набору даних.
  - Перевірити, що всі поля метаданих (назва, опис, формат, розмір, дата оновлення) відображаються коректно.
  - Натиснути кнопку завантаження у доступному форматі та переконатися в успішному старті процесу.
success_criteria:
  - Пошук повертає релевантні результати без помилок або нескінченних спіннерів.
  - Фільтри коректно обмежують вибірку даних відповідно до обраних параметрів.
  - Метадані відображаються повністю та відповідають реальним атрибутам набору.
  - Кнопка завантаження активна, процес стартує без помилок, файл має правильний формат.
navigation:
  type: ai
  url: https://data.kyivcity.gov.ua
