name: universal-page-load
goal: "Базова перевірка: сторінка відкривається, є контент, немає явної сторінки помилки"
hints:
  - "Працювати з головною сторінкою за вказаним URL"
  - "Не виконувати небезпечних дій (оплата, видалення, logout)"
steps:
  - "Wait until the page finishes loading"
  - "If a cookie consent or privacy banner is visible, accept or dismiss it using the safest available option"
  - "Scroll slightly down to reveal main page content if needed"
success_criteria:
  - "The page has loaded and shows meaningful main content (not a blank page)"
  - "There is no obvious error message like 404, 500, or 'page not found'"
  - "The page has a visible title or main heading"
navigation:
  type: deterministic
