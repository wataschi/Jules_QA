name: cyrillic-search-accuracy
goal: Перевірити коректність пошуку наборів даних та організацій за кириличними запитами на демо-сайті CKAN.
target_url: https://demo.ckan.org/ru/
tags:
  - search
  - cyrillic
  - e2e
  - localization
group: Search & Discovery
hints:
  - Використовуйте видимий текст полів та кнопок для ідентифікації елементів.
  - Якщо точна кнопка "Пошук" не знайдена, натисніть клавішу Enter у полі пошуку.
  - Перевіряйте наявність кириличних символів у заголовках результатів для підтвердження коректної індексації.
  - Уникайте залежності від динамічних ID або CSS-селекторів.
steps:
  - Перейти на сторінку за адресою https://demo.ckan.org/ru/
  - Зачекати повного завантаження сторінки
  - Ввести текст "Parking" у поле пошуку з підказкою "Поиск массивов данных..."
  - Натиснути клавішу Enter у полі пошуку
  - Зачекати відображення списку результатів пошуку
checkpoints: []
success_criteria:
  - У списку результатів хоча б один елемент має назву, що містить слово "Parking".
navigation:
  type: ai
  url: https://demo.ckan.org/ru/
